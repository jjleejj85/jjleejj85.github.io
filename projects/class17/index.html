<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>初一（17）班 德育积分统计工作台</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --border:#e4e9f2; --border-2:#eef1f7;
  --text:#1c2434; --muted:#6c7789; --muted-2:#98a2b3;
  --primary:#3c5bd9; --primary-d:#2f49b8; --primary-soft:#eef2ff;
  --green:#0d9b73; --green-soft:#e7f7f1;
  --red:#d8414a; --red-soft:#fff0f1;
  --amber:#d9820b; --amber-soft:#fff5e3;
  --purple:#7048c4; --purple-soft:#f2ecff;
  --shadow:0 1px 2px rgba(23,34,64,.04),0 8px 26px rgba(23,34,64,.055);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
.app{display:flex;min-height:100vh}

/* ---------- 侧栏 ---------- */
.side{width:230px;flex:0 0 230px;background:#fff;border-right:1px solid var(--border);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;z-index:20}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--border-2)}
.brand-t{font-size:16px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:9px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:0 0 28px}
.brand-s{color:var(--muted);font-size:12px;margin-top:6px;padding-left:37px}
.nav{padding:12px 10px;overflow-y:auto;flex:1}
.nav-cap{font-size:11px;color:var(--muted-2);letter-spacing:1px;padding:10px 12px 6px;font-weight:600}
.nav-i{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:#4a5568;cursor:pointer;margin-bottom:2px;user-select:none;transition:background .15s,color .15s}
.nav-i:hover{background:#f6f8fc;color:var(--text)}
.nav-i.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-i svg{flex:0 0 17px;opacity:.9}
.side-ft{padding:12px 18px 16px;border-top:1px solid var(--border-2);color:var(--muted-2);font-size:11px;line-height:1.7}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;padding:0 28px 70px}
.topbar{height:70px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);margin-bottom:22px;background:var(--bg);position:sticky;top:0;z-index:15}
.topbar h1{font-size:18px;margin:0;font-weight:700;white-space:nowrap}
.topbar .sub{color:var(--muted);font-size:12px;white-space:nowrap}
.spacer{flex:1}
.week-pick{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:9px;padding:6px 10px;box-shadow:var(--shadow)}
.week-pick label{font-size:12px;color:var(--muted)}
.week-pick select{border:0;background:transparent;font-weight:600;outline:none;cursor:pointer;max-width:230px}
.save-dot{font-size:11px;color:var(--muted-2);white-space:nowrap;min-width:76px;text-align:right}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
.card-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-hd h2{font-size:15px;margin:0;font-weight:700}
.card-hd .desc{color:var(--muted);font-size:12px}
.card-hd .spacer{flex:1}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin:22px 0 10px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.kpi.g::before{background:var(--green)} .kpi.r::before{background:var(--red)} .kpi.a::before{background:var(--amber)} .kpi.p::before{background:var(--purple)}
.kpi .lb{font-size:12px;color:var(--muted)}
.kpi .vl{font-size:25px;font-weight:700;line-height:1.25;margin-top:4px;letter-spacing:-.5px}
.kpi .ft{font-size:11px;color:var(--muted-2);margin-top:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:#fff;color:#3d4757;padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:#c7cfdd;background:#fafbfe}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d);border-color:var(--primary-d)}
.btn.danger{color:var(--red);border-color:#f3ccd0}
.btn.danger:hover{background:var(--red-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.iconbtn:hover{background:#f0f3f9;color:var(--text)}
.seg{display:inline-flex;background:#eef1f7;border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 10px;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(60,91,217,.1)}
textarea{width:100%;min-height:96px;resize:vertical;line-height:1.6}
label.fl{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gridEntry{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;background:#f8fafd;border-bottom:1px solid var(--border);padding:9px 10px;white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:9px 10px;border-bottom:1px solid var(--border-2);vertical-align:middle}
tbody tr:hover{background:#fafbfe}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--primary)}
th .arrow{color:var(--primary);margin-left:3px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.tbl-wrap{overflow:auto;max-height:620px;border:1px solid var(--border);border-radius:9px}
.tbl-wrap table th{top:0}
.plus{color:var(--green);font-weight:600}
.minus{color:var(--red);font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;line-height:1.6;white-space:nowrap}
.tag.g{background:var(--green-soft);color:var(--green)} .tag.r{background:var(--red-soft);color:var(--red)}
.tag.a{background:var(--amber-soft);color:var(--amber)} .tag.b{background:var(--primary-soft);color:var(--primary)}
.tag.p{background:var(--purple-soft);color:var(--purple)} .tag.n{background:#f0f2f6;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;background:#f1f4fa;color:#4a5568;border-radius:6px;padding:2px 7px;font-size:11px;margin:2px 4px 2px 0}
.chip.warn{background:var(--red-soft);color:var(--red)}
button.chip{cursor:pointer;border:1px solid var(--border);font-family:inherit;font-size:11.5px;line-height:1.7;padding:3px 10px;transition:all .15s}
button.chip:hover{border-color:var(--primary);color:var(--primary)}
button.chip.g{background:var(--green-soft);color:var(--green);border-color:#cfeee1}
button.chip.r{background:var(--red-soft);color:var(--red);border-color:#f6d4d7}
button.chip.on,button.chip.g.on,button.chip.r.on{background:var(--primary);border-color:var(--primary);color:#fff}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
.rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:#f0f2f6;color:var(--muted);font-size:11px;font-weight:700}
.rank.r1{background:#fff2cc;color:#a06a00} .rank.r2{background:#eceff4;color:#5b6472} .rank.r3{background:#fbe9dc;color:#a35a2a}
.empty{text-align:center;color:var(--muted-2);padding:34px 10px;font-size:13px}
.notice{border-radius:9px;padding:11px 14px;font-size:12.5px;line-height:1.7;margin-bottom:16px}
.notice.b{background:var(--primary-soft);color:#2d4299;border:1px solid #dde5ff}
.notice.g{background:var(--green-soft);color:#0a7355;border:1px solid #cfeee1}
.notice.a{background:var(--amber-soft);color:#95610a;border:1px solid #f7e2bc}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12px}
.bar-row .nm{width:76px;flex:0 0 76px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;background:#f0f3f9;border-radius:5px;height:14px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#5a78ea,#3c5bd9);border-radius:5px}
.bar-row .vv{width:52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.prize-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.prize{border:1px solid var(--border);border-radius:11px;padding:15px;background:#fff;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s,transform .15s}
.prize:hover{box-shadow:0 8px 22px rgba(30,45,90,.1);transform:translateY(-1px)}
.prize .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.prize .pn{font-weight:700;font-size:14px}
.prize .pd{font-size:11.5px;color:var(--muted);line-height:1.6;min-height:38px}
.prize .pf{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;border-top:1px dashed var(--border)}
.prize .cost{font-size:19px;font-weight:700;color:var(--purple)}
.tier{font-size:10px;font-weight:800;letter-spacing:.6px;padding:3px 7px;border-radius:5px;background:#f0f2f6;color:var(--muted)}
.tier.R{background:#eaf1ff;color:#3560c4} .tier.SR{background:#f2eaff;color:#7048c4} .tier.SSR{background:#fff0d9;color:#b87606}
.pos-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:7px;flex-wrap:wrap}
.pos-row .pnm{font-weight:600;min-width:180px}
.pos-row .prule{font-size:11px;color:var(--muted);flex:1;min-width:170px}
.pos-row .psub{font-size:12px;font-weight:700;color:var(--green);min-width:56px;text-align:right}
.pos-row input[type=number]{width:62px;padding:4px 7px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--primary);width:14px;height:14px;margin:0}
.mask{position:fixed;inset:0;background:rgba(20,28,48,.42);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:6vh 16px 30px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:min(720px,100%);box-shadow:0 24px 60px rgba(15,25,50,.24);max-height:88vh;display:flex;flex-direction:column}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);font-size:15px}
.modal-bd{padding:18px 20px;overflow-y:auto}
.modal-ft{padding:13px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px}
.toast{position:fixed;right:24px;bottom:24px;background:#222c3e;color:#fff;padding:11px 18px;border-radius:9px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.22);z-index:200;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;max-width:360px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.warn{background:#a3650a}.toast.err{background:#b8353e}
.acc{border:1px solid var(--border);border-radius:9px;margin-bottom:9px;overflow:hidden}
.acc-h{padding:11px 15px;background:#fafbfe;cursor:pointer;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:space-between}
.acc-b{padding:4px 15px 14px;display:none}
.acc.open .acc-b{display:block}
.acc.open .acc-h{background:var(--primary-soft);color:var(--primary)}
.form-note{font-size:11.5px;color:var(--muted-2);margin-top:4px;line-height:1.6}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hr{height:1px;background:var(--border-2);margin:18px 0}
@media (max-width:980px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;flex:none;position:static;border-right:0;border-bottom:1px solid var(--border)}
  .brand{padding:12px 16px}.brand-s{display:none}
  .nav{display:flex;overflow-x:auto;padding:8px;gap:4px}
  .nav-cap{display:none}.nav-i{white-space:nowrap;margin:0}
  .side-ft{display:none}
  .main{padding:0 14px 50px}
  .topbar{height:auto;padding:12px 0;flex-wrap:wrap;gap:10px}
  .grid3,.grid2,.gridEntry{grid-template-columns:1fr}
}
.cloud-dot{font-size:12px;padding:4px 10px;border-radius:20px;background:#eef2ff;color:#3c5bd9;white-space:nowrap;margin-right:8px}
.cloud-dot.on{background:#e7f7f1;color:#0d9b73}
.cloud-dot.warn{background:#fff5e3;color:#d9820b}
.cloud-dot.err{background:#fff0f1;color:#d8414a}
.cloud-dot.off{background:#f1f3f7;color:#6c7789}
</style>

<body>
<div class="app" style="visibility:hidden">
  <aside class="side">
    <div class="brand">
      <div class="brand-t"><span class="brand-mark">17</span>德育积分工作台</div>
      <div class="brand-s">初一（17）班 · 2026—2027 第一学期</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-ft">数据保存在云端<br>建议定期导出 JSON 备份</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h1 id="pageTitle">总览</h1><div class="sub" id="pageSub"></div></div>
      <div class="spacer"></div>
      <div class="week-pick"><label>统计周</label><select id="globalWeek" data-chg="week"></select></div>
      <span id="cloudDot" class="cloud-dot off">○ 本地模式</span>
      <div class="save-dot" id="saveDot">就绪</div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="modalWrap"></div>
<div id="toast" class="toast"></div>
<input type="file" id="fileImport" accept=".json,application/json" style="display:none">

<script>
/* ============================================================
   初一（17）班 德育积分统计工作台
   数据来源：
   1) 初一17班德育分加减细则表格.docx（简要表格版）
   2) 初一班德育分加减细则（更新版）.docx（详细要求）
   3) 初一17班德育分兑换奖励方案.docx（券种与积分）
   4) 17班 2026-2027学年第一学期现初一（2026级）学生名单8.31(1).xls
   ============================================================ */

/* ============================================================
   本地持久化层
   主存储：LocalStorage（KEY）—— 同步写入，页面打开时立即读取
   冗余副本：LocalStorage（KEY_BAK）—— 防单键数据损坏
   兜底存储：IndexedDB（IDB_NAME / IDB_STORE）—— LocalStorage 被禁用、
             配额耗尽或数据损坏时恢复；每次保存同时异步镜像
   所有用户「新增 / 编辑 / 删除」仍统一经 mutate() -> save()，业务代码不变
   ============================================================ */
const KEY='dy17_workbench_v1';
const KEY_BAK='dy17_workbench_v1__bak';
const KEY_TS='dy17_workbench_v1__ts';
const KEY_CORRUPT='dy17_workbench_v1__corrupt';
const IDB_NAME='dy17_workbench';
const IDB_STORE='state';
const IDB_ROW='snapshot';
const SCHEMA_VERSION=1;
const PERSIST={touched:false,mode:'localStorage',lastError:''};

function isPlainObject(o){return !!o&&typeof o==='object'&&!Array.isArray(o);}
function validState(o){
  return isPlainObject(o)&&Array.isArray(o.students)&&Array.isArray(o.weeks)&&
    isPlainObject(o.records)&&Array.isArray(o.redemptions)&&
    Array.isArray(o.plusRules)&&Array.isArray(o.minusRules)&&
    Array.isArray(o.positions)&&Array.isArray(o.prizes);
}
/* 兼容旧备份 / 旧版本：补齐新增字段，绝不丢弃已有记录 */
function normalizeState(o){
  const d=defaultState();
  ['className','semester','semesterStart'].forEach(k=>{if(typeof o[k]!=='string')o[k]=d[k];});
  if(typeof o.baseScore!=='number'||!isFinite(o.baseScore))o.baseScore=d.baseScore;
  if(typeof o.coinIncludePosition!=='boolean')o.coinIncludePosition=d.coinIncludePosition;
  o.students.forEach(s=>{if(typeof s.sex!=='string')s.sex='';});
  o.weeks.forEach(w=>{if(!w.range)w.range=String(w.start||'').slice(5).replace('-','.')+'–'+String(w.end||'').slice(5).replace('-','.');});
  o.plusRules.forEach(r=>{if(typeof r.cat!=='string')r.cat='其他';if(typeof r.cap!=='number')r.cap=0;});
  o.minusRules.forEach(r=>{if(typeof r.cat!=='string')r.cat='其他';});
  o.positions.forEach(p=>{if(!p.mode)p.mode='fixed';if(typeof p.points!=='number')p.points=0;
    if(typeof p.unit!=='number')p.unit=0;if(typeof p.group!=='string')p.group='';});
  o.prizes.forEach(p=>{if(typeof p.enabled!=='boolean')p.enabled=true;
    if(typeof p.cost!=='number')p.cost=0;if(typeof p.weeklyLimit!=='number')p.weeklyLimit=0;});
  Object.keys(o.records).forEach(k=>{
    const rec=o.records[k];if(!isPlainObject(rec))return;
    if(!Array.isArray(rec.entries))rec.entries=[];
    if(!Array.isArray(rec.positions))rec.positions=[];
    rec.entries.forEach(e=>{if(e&&!e.cat){
      const list=e.type==='plus'?o.plusRules:o.minusRules;
      const r=list.find(x=>x.id===e.ruleId);e.cat=r?r.cat:'其他';}});
  });
  o.version=SCHEMA_VERSION;
  return o;
}
function parseState(raw){
  if(!raw||typeof raw!=='string')return null;
  try{const o=JSON.parse(raw);return validState(o)?normalizeState(o):null;}catch(e){return null;}
}
function readLocalKey(k){try{return localStorage.getItem(k)||null;}catch(e){return null;}}
function readLocal(){
  const main=readLocalKey(KEY),bak=readLocalKey(KEY_BAK);
  let o=parseState(main);
  if(o)return o;
  o=parseState(bak);
  if(o){
    /* 主键损坏但副本完好：立即修复主键，避免每次打开都依赖副本 */
    try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}
    return o;
  }
  /* 数据损坏：原文另存，不用默认值直接覆盖，等待 IndexedDB 恢复 */
  if(main||bak){
    try{localStorage.setItem(KEY_CORRUPT,String(main||'').length>String(bak||'').length?main:bak);}catch(e){}
  }
  return null;
}
function writeLocal(text,ts){
  let ok=false;
  try{localStorage.setItem(KEY,text);ok=(localStorage.getItem(KEY)===text);}
  catch(e){PERSIST.lastError=String((e&&e.message)||e);}
  if(ok){try{localStorage.setItem(KEY_BAK,text);localStorage.setItem(KEY_TS,String(ts));}catch(e){}}
  return ok;
}
function localTs(){try{return Number(localStorage.getItem(KEY_TS))||0;}catch(e){return 0;}}
/* ---------- IndexedDB ---------- */
function idbOpen(){
  return new Promise(function(resolve,reject){
    if(typeof indexedDB==='undefined'||!indexedDB){reject(new Error('IndexedDB 不可用'));return;}
    let req;try{req=indexedDB.open(IDB_NAME,1);}catch(e){reject(e);return;}
    req.onupgradeneeded=function(){const db=req.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);};
    req.onsuccess=function(){resolve(req.result);};
    req.onerror=function(){reject(req.error||new Error('IndexedDB 打开失败'));};
    req.onblocked=function(){reject(new Error('IndexedDB 被阻塞'));};
  });
}
function idbRead(){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      let value=null;
      const tx=db.transaction(IDB_STORE,'readonly'),req=tx.objectStore(IDB_STORE).get(IDB_ROW);
      req.onsuccess=function(){value=req.result||null;};
      req.onerror=function(){reject(req.error);};
      tx.oncomplete=function(){db.close();resolve(value);};
      tx.onerror=function(){db.close();reject(tx.error);};
    });
  });
}
function idbWrite(text){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      const tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(text,IDB_ROW);
      tx.oncomplete=function(){db.close();resolve(true);};
      tx.onerror=function(){db.close();reject(tx.error||new Error('写入失败'));};
      tx.onabort=function(){db.close();reject(tx.error||new Error('写入中止'));};
    });
  });
}
/* 串行镜像：保证最终落盘的一定是最新快照，避免并发事务乱序 */
let idbChain=Promise.resolve(true),idbLatest='',idbLatestTs=0,idbWritten='';
function idbWriteSafe(text,ts){
  idbLatest=text;idbLatestTs=ts;
  idbChain=idbChain.then(function(){
    const t=idbLatest,stamp=idbLatestTs;
    if(t===idbWritten)return true;
    const payload=JSON.stringify({v:t,t:stamp});
    return idbWrite(payload).then(function(){idbWritten=t;return true;},
      function(e){PERSIST.lastError=String((e&&e.message)||e);return false;});
  });
  return idbChain;
}

/* ---------- 状态 <-> 行集合 ---------- */
function cloudDeep(o){return JSON.parse(JSON.stringify(o));}
function cloudFlatten(st){
  const sp=CLOUD.cfg?CLOUD.cfg.space:'',meta={};
  /* 必须深拷贝：快照若持有业务对象引用，后续编辑会同步改动快照，
     diff 将误判为「无变化」而漏传明细行 */
  Object.keys(st).forEach(function(k){if(k!=='records'&&k!=='redemptions')meta[k]=cloudDeep(st[k]);});
  const out={meta:meta,entries:new Map(),positions:new Map(),redemptions:new Map()};
  Object.keys(st.records||{}).forEach(function(k){
    const rec=st.records[k];if(!isPlainObject(rec))return;
    const i=k.indexOf('::'),w=i<0?k:k.slice(0,i),sid=i<0?'':k.slice(i+2);
    (rec.entries||[]).forEach(function(e,ix){
      const id=sp+':e:'+String(e&&e.id?e.id:k+':'+ix);
      out.entries.set(id,{id:id,space_id:sp,week_key:w,student_id:sid,payload:cloudDeep(e)});
    });
    (rec.positions||[]).forEach(function(p,ix){
      const id=sp+':p:'+w+'::'+sid+'::'+String(p&&p.positionId?p.positionId:ix);
      out.positions.set(id,{id:id,space_id:sp,week_key:w,student_id:sid,payload:cloudDeep(p)});
    });
  });
  (st.redemptions||[]).forEach(function(r,ix){
    const id=sp+':r:'+String(r&&r.id?r.id:ix);
    out.redemptions.set(id,{id:id,space_id:sp,payload:cloudDeep(r)});
  });
  return out;
}
function cloudAssemble(meta,en,pos,rd){
  const st={};Object.keys(meta||{}).forEach(function(k){st[k]=meta[k];});
  st.records={};st.redemptions=[];
  (en||[]).forEach(function(r){
    const k=recKey(r.week_key,r.student_id);
    if(!st.records[k])st.records[k]={entries:[],positions:[]};
    st.records[k].entries.push(r.payload);
  });
  (pos||[]).forEach(function(r){
    const k=recKey(r.week_key,r.student_id);
    if(!st.records[k])st.records[k]={entries:[],positions:[]};
    st.records[k].positions.push(r.payload);
  });
  (rd||[]).forEach(function(r){st.redemptions.push(r.payload);});
  return normalizeState(st);
}
function cloudDiff(prev,now){
  const out={upserts:{},deletes:{}};
  CLOUD_TABLES.forEach(function(t){
    const add=[],del=[];
    now[t].forEach(function(row,id){
      const old=prev&&prev[t].get(id);
      if(!old||JSON.stringify(old)!==JSON.stringify(row))add.push(row);
    });
    if(prev)prev[t].forEach(function(row,id){if(!now[t].has(id))del.push(id);});
    out.upserts[t]=add;out.deletes[t]=del;
  });
  return out;
}

/* ---------- 读取：4 张表组装为状态 ---------- */
async function cloudPull(){
  const q='?select=*&space_id=eq.'+cloudEnc(CLOUD.cfg.space);
  const r=await Promise.all([
    cloudReq('GET','dy17_meta'+q),cloudReq('GET','dy17_entries'+q),
    cloudReq('GET','dy17_positions'+q),cloudReq('GET','dy17_redemptions'+q)
  ]);
  if(!r[0]||!r[0].length)return false;
  const keepW=UI.weekKey,keepS=UI.coinStudentId;
  const st=cloudAssemble(r[0][0].payload,r[1],r[2],r[3]);
  S=st;CLOUD.rev=Number(r[0][0].rev)||1;
  CLOUD.loaded=true;
  CLOUD.snapshot=cloudFlatten(S);
  try{const text=JSON.stringify(S);writeLocal(text,Date.now());idbWriteSafe(text,Date.now());}catch(e){}
  initWeek();
  if(S.weeks.some(function(w){return w.key===keepW;}))UI.weekKey=keepW;
  if(keepS&&S.students.some(function(s){return s.id===keepS;}))UI.coinStudentId=keepS;
  render();
  CLOUD.lastSync=Date.now();
  return true;
}

/* ---------- 写入：按 diff 执行行级新增 / 编辑 / 删除 ---------- */
async function cloudPush(force){
  if(CLOUD_ONLY&&!CLOUD.loaded)throw new Error('云端数据尚未加载，已阻止上传');
  if(!CLOUD.cfg||CLOUD.busy)return false;
  CLOUD.busy=true;cloudStatus('sync','正在上传…');
  try{
    const sp=CLOUD.cfg.space;
    const mr=await cloudReq('GET','dy17_meta?select=rev&space_id=eq.'+cloudEnc(sp));
    const remoteRev=mr&&mr.length?Number(mr[0].rev)||0:0;
    if(!force&&remoteRev>CLOUD.rev){
      CLOUD.lastError='云端版本较新，本次修改尚未上传；请先点「从云端拉取」';
      CLOUD.dirty=true;cloudStatus('error','云端版本较新');
      toast(CLOUD.lastError,'warn');
      return false;
    }
    const now=cloudFlatten(S),d=cloudDiff(CLOUD.snapshot,now);
    for(const t of CLOUD_TABLES){
      for(const id of d.deletes[t])await cloudReq('DELETE','dy17_'+t+'?id=eq.'+cloudEnc(id));
      if(d.upserts[t].length){
        await cloudReq('POST','dy17_'+t,d.upserts[t],'resolution=merge-duplicates,return=minimal');
      }
    }
    const newRev=Math.max(remoteRev,CLOUD.rev)+1;
    await cloudReq('POST','dy17_meta',[{space_id:sp,payload:now.meta,rev:newRev}],
      'resolution=merge-duplicates,return=minimal');
    CLOUD.rev=newRev;CLOUD.snapshot=now;CLOUD.dirty=false;
    CLOUD.lastError='';CLOUD.lastSync=Date.now();
    cloudStatus('online');
    return true;
  }catch(e){
    CLOUD.lastError=String((e&&e.message)||e);
    cloudStatus('error',CLOUD.lastError.slice(0,36));
    return false;
  }finally{CLOUD.busy=false;}
}
/* 用本机数据整体覆盖云端前，先清空该空间的全部行（真实的 DELETE） */
async function cloudWipeRemote(){
  if(CLOUD_ONLY&&!CLOUD.loaded)throw new Error('云端数据尚未加载，已阻止覆盖');
  const q='?space_id=eq.'+cloudEnc(CLOUD.cfg.space);

  await cloudReq('DELETE','dy17_meta'+q);

/* ---------- 轮询：电脑改动后，手机自动读到最新 ---------- */
function cloudTick(){
  if(!CLOUD.cfg||CLOUD.busy)return;
  const sp=CLOUD.cfg.space;
  cloudReq('GET','dy17_meta?select=rev&space_id=eq.'+cloudEnc(sp)).then(function(rows){
    const rev=rows&&rows.length?Number(rows[0].rev)||0:0;
    if(rev>CLOUD.rev){
      return cloudPull().then(function(ok){
        if(ok)cloudStatus('online','已同步最新');
        else cloudStatus('offline','云端尚未初始化');
      });
    }
    if(CLOUD.dirty)return cloudPush(false);
    if(CLOUD.status!=='online')cloudStatus('online');
  }).catch(function(e){
    CLOUD.lastError=String((e&&e.message)||e);
    cloudStatus('offline');
  });
}
async function cloudStart(){
  CLOUD.cfg=cloudLoadCfg();
  if(!CLOUD.cfg){cloudStatus('off');return;}
  CLOUD.started=true;cloudStatus('sync','连接中…');
  try{
    const ok=await cloudPull();           /* 云端已有数据 -> 以云端为准 */
    if(!ok){
      if(CLOUD_ONLY)throw new Error('云端尚无工作台数据，请先从本机工作台上传');
      await cloudPush(true);             /* 本地版才能首次迁移 */
    }
    else cloudStatus('online');
  }catch(e){
    CLOUD.lastError=String((e&&e.message)||e);
    cloudStatus('offline');
  }
  if(CLOUD.pollTimer)clearInterval(CLOUD.pollTimer);
  CLOUD.pollTimer=setInterval(cloudTick,6000);
  if(!CLOUD._eventsBound){
    CLOUD._eventsBound=true;
    document.addEventListener('visibilitychange',function(){if(!document.hidden)cloudTick();});
    window.addEventListener('online',function(){cloudTick();});
  }
}

function save(){
  let text;
  try{text=JSON.stringify(S);}catch(e){PERSIST.lastError=String((e&&e.message)||e);return false;}
  const d=new Date(),tm=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  const stamp=Date.now();
  const lsOK=writeLocal(text,stamp);
  const mirrored=idbWriteSafe(text,stamp);   /* 同一时间戳，避免下次启动误判为镜像更新 */
  if(lsOK){
    PERSIST.mode='localStorage';
    $('#saveDot').textContent='已保存 '+tm;
  }else{
    /* 主存储不可用：以 IndexedDB 为准，写入结果决定状态提示 */
    PERSIST.mode='IndexedDB';
    $('#saveDot').textContent='正在写入备份库…';
    mirrored.then(function(ok){
      $('#saveDot').textContent=ok?'已保存 '+tm:'存储失败';
      if(!ok)toast('本地存储不可用，请立即导出 JSON 备份','warn');
    });
  }
  cloudSchedule();   /* 本地缓存写入后，异步增量推送到云端 */
  return lsOK;
}
/* 启动时比对时间戳：本地副本缺失或比 IndexedDB 镜像更旧时，从镜像恢复 */
function restoreFromIdb(){
  if(CLOUD_ONLY)return; // 发布版只在登录成功后使用云端快照
  idbRead().then(function(raw){
    if(!raw)return;
    let payload=raw;
    if(typeof raw==='string'){try{payload=JSON.parse(raw);}catch(e){payload=null;}}
    if(!payload||!payload.v)return;
    const stamp=Number(payload.t)||0,lts=localTs();
    if(BOOT){
      if(lts===0)return;                 /* 旧版本写入的本地数据，以本地为准 */
      if(stamp<=lts)return;              /* 本地数据更新，无需恢复 */
    }
    /* BOOT 为空（本地无有效数据）时，无论时间戳如何都尝试从镜像恢复 */
    const o=parseState(payload.v);
    if(!o||PERSIST.touched)return;       /* 用户已开始操作，绝不覆盖 */
    S=o;
    writeLocal(JSON.stringify(S),stamp);  /* 回填主存储，下次打开直接命中 */
    initWeek();
    render();
    $('#saveDot').textContent='已从备份库恢复';
  }).catch(function(e){PERSIST.lastError=String((e&&e.message)||e);});
}

/* ---------- 记录与计算 ---------- */
function recKey(w,s){return w+'::'+s;}
function getRec(w,s,create){
  const k=recKey(w,s);
  if(!S.records[k]){if(!create)return {entries:[],positions:[]};S.records[k]={entries:[],positions:[]};}
  return S.records[k];
}
function ruleOf(type,id){return (type==='plus'?S.plusRules:S.minusRules).find(r=>r.id===id);}
function posDef(id){return S.positions.find(p=>p.id===id);}
function posPoints(a){
  const d=posDef(a.positionId);if(!d||a.qualified===false)return 0;
  return d.mode==='count'?r2((Number(a.count)||0)*(Number(d.unit)||0)):r2(Number(d.points)||0);
}
function positionBonus(rec){
  const arr=(rec.positions||[]).map(a=>({a:a,d:posDef(a.positionId),v:posPoints(a)})).filter(x=>x.d);
  const groups={},free=[];let total=0;
  arr.forEach(x=>{const g=(x.d.group||'').trim();if(g)(groups[g]=groups[g]||[]).push(x);else free.push(x);});
  free.forEach(x=>total+=x.v);
  Object.keys(groups).forEach(g=>{total+=Math.max.apply(null,[0].concat(groups[g].map(x=>x.v)));});
  return r2(total);
}
function weekStat(w,sid){
  const rec=getRec(w,sid,false);
  let plusEntries=0,minusEntries=0;const caps={},plusByCat={},minusByCat={};
  (rec.entries||[]).forEach(e=>{
    const v=r2((Number(e.unit)||0)*(Number(e.times)||0));
    const rule=ruleOf(e.type,e.ruleId);
    const cat=e.cat||(rule&&rule.cat)||'其他';
    if(e.type==='plus'){
      if(rule&&Number(rule.cap)>0){const k=rule.id;caps[k]=caps[k]||{sum:0,cap:Number(rule.cap),cat:cat};caps[k].sum+=v;}
      else{plusEntries+=v;plusByCat[cat]=r2((plusByCat[cat]||0)+v);}
    }else{minusEntries+=v;minusByCat[cat]=r2((minusByCat[cat]||0)+v);}
  });
  Object.keys(caps).forEach(k=>{const c=caps[k],v=Math.min(c.sum,c.cap);
    plusEntries+=v;plusByCat[c.cat]=r2((plusByCat[c.cat]||0)+v);});
  const posBonus=positionBonus(rec);
  if(posBonus)plusByCat['职务']=r2((plusByCat['职务']||0)+posBonus);
  const a=r2(plusEntries),b=r2(minusEntries);
  const totalPlus=r2(a+posBonus);
  return {plusEntries:a,minusEntries:b,posBonus:posBonus,totalPlus:totalPlus,totalMinus:b,
    total:r2(Number(S.baseScore)+totalPlus-b),plusByCat:plusByCat,minusByCat:minusByCat,
    entryCount:(rec.entries||[]).length,rec:rec};
}
function termStat(sid){
  let pe=0,me=0,pb=0;const pbc={},mbc={};
  S.weeks.forEach(w=>{const t=weekStat(w.key,sid);
    pe+=t.plusEntries;me+=t.minusEntries;pb+=t.posBonus;
    Object.keys(t.plusByCat).forEach(c=>pbc[c]=r2((pbc[c]||0)+t.plusByCat[c]));
    Object.keys(t.minusByCat).forEach(c=>mbc[c]=r2((mbc[c]||0)+t.minusByCat[c]));});
  const tp=r2(pe+pb),tm=r2(me);
  return {plusEntries:r2(pe),posBonus:r2(pb),totalPlus:tp,totalMinus:tm,
    total:r2(Number(S.baseScore)+tp-tm),plusByCat:pbc,minusByCat:mbc};
}
/* 类别维度：'' = 综合；'P|__all__' / 'M|__all__' = 单项加分 / 单项扣分合计；
   'P|<类别>' / 'M|<类别>' = 具体类别；职务加分归入 'P|职务' */
function catList(type){
  const src=type==='P'?S.plusRules:S.minusRules,out=[];
  src.forEach(r=>{if(r.cat&&out.indexOf(r.cat)<0)out.push(r.cat);});
  if(type==='P'&&out.indexOf('职务')<0)out.push('职务');
  return out;
}
function dimLabel(dim){
  if(!dim)return '综合总分';
  const p=dim.split('|'),t=p[0],c=p[1];
  if(c==='__all__')return t==='P'?'单项加分合计':'单项扣分合计';
  return c+(t==='P'?' 加分':' 扣分');
}
function dimValue(row,dim){
  if(!dim)return row.total;
  const p=dim.split('|'),t=p[0],c=p[1];
  if(c==='__all__')return t==='P'?row.plusEntries:row.totalMinus;
  return r2((t==='P'?row.plusByCat:row.minusByCat)[c]||0);
}
function validDims(){
  const out=['P|__all__','M|__all__'];
  catList('P').forEach(c=>out.push('P|'+c));
  catList('M').forEach(c=>out.push('M|'+c));
  return out;
}

    catList('P').map(c=>'<option value="P|'+esc(c)+'"'+(UI.catDim==='P|'+c?' selected':'')+'>'+esc(c)+' · 加分</option>').join('')+'</optgroup>';

function catTotals(rows){
  rows=rows||statRows();const p={},m={};
  rows.forEach(r=>{
    Object.keys(r.plusByCat).forEach(c=>p[c]=r2((p[c]||0)+r.plusByCat[c]));
    Object.keys(r.minusByCat).forEach(c=>m[c]=r2((m[c]||0)+r.minusByCat[c]));
  });
  return {p:p,m:m};
}
function coinEarned(sid){
  if(S.coinIncludePosition)return termStat(sid).totalPlus;
  let sum=0;S.weeks.forEach(w=>sum+=weekStat(w.key,sid).plusEntries);return r2(sum);
}
function coinSpent(sid){return r2(S.redemptions.filter(r=>r.status!=='void'&&r.studentId===sid).reduce((s,r)=>s+(Number(r.cost)||0),0));}
function coinBalance(sid){return r2(coinEarned(sid)-coinSpent(sid));}
function studentById(id){return S.students.find(s=>s.id===id);}
function studentLabel(s){return s.seq+'. '+s.name+'（'+s.id+'）';}
function weekByKey(k){return S.weeks.find(w=>w.key===k)||S.weeks[0]||{key:'',label:'—',range:'',start:'',end:''};}
function curWeek(){return weekByKey(UI.weekKey);}
function penalty(sid,wkey){
  const idx=S.weeks.findIndex(w=>w.key===wkey);if(idx<0)return '';
  let streak=0;
  for(let i=idx;i>=0;i--){if(weekStat(S.weeks[i].key,sid).totalMinus>=10)streak++;else break;}
  const m=weekStat(wkey,sid).totalMinus;
  if(m>=15)return '一周扣满 15 分：通报家长、书面检讨';
  if(streak>=3)return '连续 3 周扣满 10 分：通报家长';
  if(streak>=2)return '连续 2 周扣满 10 分：通知家长、检讨签字';
  if(m>=10)return '一周扣满 10 分：全班通报 + 书面反思';
  return '';
}
function allEntries(){
  const out=[];
  Object.keys(S.records).forEach(k=>{
    const p=k.split('::'),rec=S.records[k];
    (rec.entries||[]).forEach(e=>out.push(Object.assign({},e,{weekKey:p[0],studentId:p[1]})));

function resolveStudent(v){
  v=String(v||'').trim();if(!v)return null;
  let st=S.students.find(s=>s.name===v||s.id===v);
  if(!st){const m=v.match(/\d{6,}/);if(m)st=S.students.find(s=>s.id===m[0]);}
  if(!st)st=S.students.find(s=>v.indexOf(s.name)>=0);
  return st||null;
}

const STAT_COLS=[['seq','序号'],['id','学号'],['name','姓名'],['plusEntries','单项加分'],['posBonus','职务加分'],['totalPlus','总加分'],['totalMinus','总扣分'],['total','总分'],['coin','可用虚拟币']];

function statRows(){
  const scope=UI.scope;
  return S.students.map(s=>{
    const t=scope==='week'?weekStat(UI.weekKey,s.id):termStat(s.id);
    const row={s:s,seq:s.seq,id:s.id,name:s.name,sex:s.sex,plusEntries:t.plusEntries,posBonus:t.posBonus,
      totalPlus:t.totalPlus,totalMinus:t.totalMinus,total:t.total,coin:coinBalance(s.id),

function sortedStatRows(){return sortStatRows(statRows());}
function sortStatRows(rows){
  const q=UI.statsQ.trim().toLowerCase();
  const list=q?rows.filter(r=>(r.name+' '+r.id).toLowerCase().indexOf(q)>=0):rows.slice();
  const k=UI.sortKey,dir=UI.sortDir==='asc'?1:-1;
  list.sort((a,b)=>{
    let x=a[k],y=b[k];
    if(k==='name'||k==='id'||k==='sex'){x=String(x);y=String(y);return x.localeCompare(y,'zh-CN')*dir;}
    return ((Number(x)||0)-(Number(y)||0))*dir||(a.seq-b.seq);
  });
  let last=null,rank=0;
  list.forEach((r,i)=>{const v=r[k];if(last===null||v!==last){rank=i+1;last=v;}r._rank=rank;});
  return list;
}

      (p.mode==='count'?'<label class="chk">次数 <input type="number" class="pos-count" min="0" step="1" value="'+fmt(a.count||0)+'"></label>':'')+
      '<label class="chk" title="不认真完成工作不予加分"><input type="checkbox" class="pos-qual" '+(!checked||a.qualified!==false?'checked':'')+'> 履职合格</label>'+
      '<span class="psub">+0</span></div>';
  }).join('');

function updatePosSubtotals(){
  $$('.pos-row').forEach(row=>{
    const p=posDef(row.dataset.pos);if(!p)return;
    const on=row.querySelector('.pos-check').checked;
    const qual=row.querySelector('.pos-qual').checked;
    const cntEl=row.querySelector('.pos-count');
    const v=(!on||!qual)?0:(p.mode==='count'?r2((Number(cntEl&&cntEl.value)||0)*(Number(p.unit)||0)):r2(Number(p.points)||0));
    row.querySelector('.psub').textContent='+'+fmt(v);
  });
}

/* ============================================================
   事件处理
   ============================================================ */
document.addEventListener('click',function(ev){
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,d=el.dataset;
  if(a==='modalMask'){if(ev.target===el)closeModal();return;}
  if(a==='modalClose'){closeModal();return;}
  if(a==='confirmYes'){const cb=CONFIRM_CB;dropConfirm();if(cb)cb();return;}
  if(a==='confirmNo'){dropConfirm();return;}
  if(a==='confirmMask'){if(ev.target===el)dropConfirm();return;}
  if(a==='tab'){UI.tab=d.tab;render();window.scrollTo(0,0);return;}
  /* --- 云同步 --- */
  if(a==='cloudConnect'){cloudConnect();return;}
  if(a==='cloudOff'){cloudOff();return;}
  if(a==='authSignOut'){authSignOut();return;}
  if(a==='cloudPull'){
    if(!CLOUD.cfg){toast('请先配置并连接云端','err');return;}
    cloudPull().then(function(ok){toast(ok?'已拉取云端最新数据':'云端还没有数据，请先上传');rerender();})
      .catch(function(e){toast('拉取失败：'+e.message,'err');});return;
  }
  if(a==='cloudPush'){
    if(!CLOUD.cfg){toast('请先配置并连接云端','err');return;}
    cloudPush(false).then(function(ok){toast(ok?'已上传到云端':'上传未完成：'+CLOUD.lastError);rerender();});return;
  }
  if(a==='cloudOverwrite'){
    if(!CLOUD.cfg){toast('请先配置并连接云端','err');return;}
    askConfirm('用本机当前数据覆盖云端？云端现有记录会被全部替换，此操作不可撤销。',function(){
      cloudWipeRemote().then(function(){CLOUD.snapshot=null;CLOUD.rev=0;return cloudPush(true);})
        .then(function(ok){toast(ok?'已用本机数据覆盖云端':'覆盖失败：'+CLOUD.lastError);rerender();})
        .catch(function(e){toast('覆盖失败：'+e.message,'err');});
    });return;
  }
  if(a==='cloudCopy'){
    const code=cloudConfigCode();if(!code){toast('请先保存并连接云端','err');return;}
    const box=document.getElementById('cloudCode');if(box)box.value=code;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(code).then(function(){toast('配置码已复制，粘贴到手机即可');},
        function(){toast('配置码已生成，请手动复制输入框内容');});
    }else toast('配置码已生成，请手动复制输入框内容');
    return;
  }
  if(a==='cloudApplyCode'){
    const o=cloudApplyCode(fv('cloudCode'));if(!o)return;
    cloudSetCfg(o);CLOUD.rev=0;CLOUD.snapshot=null;CLOUD.lastError='';
    cloudStart();toast('配置已应用，正在连接云端…');return;
  }
  if(a==='scope'){UI.scope=d.scope;rerender();return;}
  if(a==='catPick'){UI.catDim=d.dim||'';UI.sortKey=UI.catDim?'catVal':'total';UI.sortDir='desc';rerender();return;}
  if(a==='sort'){if(UI.sortKey===d.key)UI.sortDir=UI.sortDir==='desc'?'asc':'desc';else{UI.sortKey=d.key;UI.sortDir='desc';}rerender();return;}
  if(a==='sortDir'){UI.sortDir=UI.sortDir==='desc'?'asc':'desc';rerender();return;}
  if(a==='guideToggle'){UI.guide[d.key]=!UI.guide[d.key];rerender();return;}

  /* --- 积分录入 --- */
  if(a==='entryType'){UI.entryType=d.type;UI.entryRuleId=(d.type==='plus'?S.plusRules:S.minusRules)[0]?.id||'';rerender();return;}
  if(a==='entryAdd'){
    const st=resolveStudent(fv('entryStudent'));if(!st){toast('请先选择或输入正确的学生姓名 / 学号','err');return;}
    UI.entryStudent=fv('entryStudent');
    const rid=fv('entryRule'),rule=ruleOf(UI.entryType,rid);
    const unit=fn('entryUnit'),times=fn('entryTimes');
    if(unit<=0||times<=0){toast('分值与次数需大于 0','err');return;}
    mutate(()=>{getRec(UI.weekKey,st.id,true).entries.push({id:uid(),type:UI.entryType,ruleId:rid,cat:rule?rule.cat:'其他',label:rule?rule.label:'自定义项目',unit:r2(unit),times:r2(times),note:fv('entryNote'),ts:Date.now()});});
    toast('已为 '+st.name+' 登记'+(UI.entryType==='plus'?'加分':'扣分')+' '+fmt(r2(unit*times))+' 分');return;
  }
  if(a==='entryEdit'){
    const rec=getRec(d.w,d.s,false),e=(rec.entries||[]).find(x=>x.id===d.id);if(!e)return;
    UI.modalCtx={w:d.w,s:d.s,id:d.id};
    const body='<div class="grid2"><div class="field"><label class="fl">类型</label><select id="efType" style="width:100%"><option value="plus"'+(e.type==='plus'?' selected':'')+'>加分</option><option value="minus"'+(e.type==='minus'?' selected':'')+'>扣分</option></select></div>'+
     '<div class="field"><label class="fl">项目名称</label><input type="text" id="efLabel" value="'+esc(e.label)+'" style="width:100%"></div></div>'+
     '<div class="grid2"><div class="field"><label class="fl">单项分值</label><input type="number" id="efUnit" step="0.5" min="0" value="'+fmt(e.unit)+'" style="width:100%"></div>'+
     '<div class="field"><label class="fl">次数</label><input type="number" id="efTimes" step="1" min="1" value="'+fmt(e.times)+'" style="width:100%"></div></div>'+
     '<div class="field"><label class="fl">备注</label><input type="text" id="efNote" value="'+esc(e.note||'')+'" style="width:100%"></div>';
    showModal('修改单项记录 · '+(studentById(d.s)||{}).name,body,'entrySave');return;
  }
  if(a==='entrySave'){
    const c=UI.modalCtx,rec=getRec(c.w,c.s,true),e=(rec.entries||[]).find(x=>x.id===c.id);
    if(e){e.type=fv('efType');e.label=fv('efLabel')||e.label;e.unit=r2(fn('efUnit'));e.times=r2(fn('efTimes'));e.note=fv('efNote');
      const nr=ruleOf(e.type,e.ruleId);e.cat=nr?nr.cat:(e.cat||'其他');}
    closeModal();mutate(()=>{});toast('记录已更新');return;
  }
  if(a==='entryDel'){
    const rec=getRec(d.w,d.s,true),i=(rec.entries||[]).findIndex(x=>x.id===d.id);
    if(i<0)return;
    askConfirm('确认删除这条'+(rec.entries[i].type==='plus'?'加分':'扣分')+'记录？该操作不可撤销。',function(){
      rec.entries.splice(i,1);mutate(()=>{});toast('记录已删除');
    });return;
  }
  if(a==='entryBatch'){
    const body='<div class="field"><label class="fl">扣分项目</label><select id="bfRule" style="width:100%">'+ruleOptions('minus','m24')+'</select></div>'+
     '<div class="grid2"><div class="field"><label class="fl">每人分值</label><input type="number" id="bfUnit" step="0.5" min="0" value="5" style="width:100%"></div>'+
     '<div class="field"><label class="fl">次数</label><input type="number" id="bfTimes" step="1" min="1" value="1" style="width:100%"></div></div>'+
     '<div class="field"><label class="fl">备注</label><input type="text" id="bfNote" placeholder="如：周一升旗全班被点名批评" style="width:100%"></div>'+
     '<div class="notice a">将为全班 '+S.students.length+' 名学生各生成 1 条扣分记录（'+esc(curWeek().label)+'）。</div>';
    showModal('全班批量扣分',body,'entryBatchSave','确认批量录入');return;
  }
  if(a==='entryBatchSave'){
    const rid=fv('bfRule'),rule=ruleOf('minus',rid),unit=r2(fn('bfUnit')),times=r2(fn('bfTimes')),note=fv('bfNote');
    if(unit<=0||times<=0){toast('分值与次数需大于 0','err');return;}
    askConfirm('确认为全班 '+S.students.length+' 人各登记 −'+fmt(r2(unit*times))+' 分？',function(){
      closeModal();
      mutate(()=>{S.students.forEach(s=>{getRec(UI.weekKey,s.id,true).entries.push({id:uid(),type:'minus',ruleId:rid,cat:rule?rule.cat:'其他',label:rule?rule.label:'自定义扣分',unit:unit,times:times,note:note,ts:Date.now()});});});
      toast('已为全班 '+S.students.length+' 人登记扣分');
    });return;
  }

  /* --- 职位填报 --- */
  if(a==='posEdit'){
    const s=studentById(d.s);if(!s)return;
    UI.modalCtx={sid:d.s};
    const body='<div class="notice b">'+esc(curWeek().label+' '+curWeek().range)+' · <b>'+esc(s.name)+'</b>（'+esc(s.id)+'）。勾选本周担任的职务，可多选；职务每周可变动。</div>'+positionRowsHtml(d.s)+
      '<div class="notice g" style="margin-top:10px">本周职务加分合计（预览）：<b id="posTotal">0</b> 分。互斥组仅计最高项，履职不合格计 0 分。</div>';
    showModal('职位填报 · '+s.name,body,'posSave','保存本周职位');
    setTimeout(function(){updatePosSubtotals();updatePosTotal();},0);return;
  }
  if(a==='posSave'){
    const sid=UI.modalCtx.sid,rows=$$('.pos-row'),arr=[];
    rows.forEach(row=>{if(!row.querySelector('.pos-check').checked)return;
      const p=posDef(row.dataset.pos);if(!p)return;
      const cnt=row.querySelector('.pos-count');
      arr.push({positionId:p.id,count:cnt?r2(Number(cnt.value)||0):0,qualified:row.querySelector('.pos-qual').checked});
    });
    closeModal();mutate(()=>{getRec(UI.weekKey,sid,true).positions=arr;});toast('本周职位已保存');return;
  }
  if(a==='posCopyPrev'){
    const idx=S.weeks.findIndex(x=>x.key===UI.weekKey),prev=S.weeks[idx-1];
    if(!prev){toast('当前已是第一周','warn');return;}
    askConfirm('将 '+prev.label+' 的职位填报复制到 '+curWeek().label+'？本周已有的填报会被覆盖。',function(){
      mutate(()=>{S.students.forEach(s=>{const src=getRec(prev.key,s.id,false);getRec(UI.weekKey,s.id,true).positions=clone(src.positions||[]);});});
      toast('已复制上一周职位');
    });return;
  }
  if(a==='posClearWeek'){
    askConfirm('确认清空 '+curWeek().label+' 全部学生的职位填报？该周职务加分将归零。',function(){
      mutate(()=>{S.students.forEach(s=>{if(S.records[recKey(UI.weekKey,s.id)])S.records[recKey(UI.weekKey,s.id)].positions=[];});});
      toast('本周职位已清空');
    });return;
  }
  if(a==='posBatch'){
    UI.modalCtx={};
    const body='<div class="field"><label class="fl">选择学生（可多选，默认全选）</label><input type="text" id="pbQ" placeholder="输入姓名快速筛选" style="width:100%;margin-bottom:8px"><div id="pbStudents" style="max-height:190px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:8px">'+
      S.students.map(s=>'<label class="chk" style="display:inline-flex;width:31%;margin:3px 0" data-name="'+esc(s.name)+'"><input type="checkbox" class="pb-stu" value="'+esc(s.id)+'" checked> '+esc(s.seq+'. '+s.name)+'</label>').join('')+'</div>'+
      '<div class="inline" style="margin-top:6px"><button class="btn sm" data-act="pbAll">全选</button><button class="btn sm" data-act="pbNone">全不选</button></div></div>'+
      '<div class="field"><label class="fl">选择职务（可多选）</label><div style="border:1px solid var(--border);border-radius:8px;padding:8px">'+
      S.positions.map(p=>'<label class="chk" style="display:inline-flex;width:48%;margin:3px 0"><input type="checkbox" class="pb-pos" value="'+esc(p.id)+'"> '+esc(p.name)+'</label>').join('')+'</div></div>'+
      '<div class="grid2"><div class="field"><label class="fl">方式</label><select id="pbMode" style="width:100%"><option value="append">追加到现有职位</option><option value="replace">替换为所选职位</option></select></div>'+
      '<div class="field"><label class="fl">按次职务的默认次数</label><input type="number" id="pbCount" min="0" step="1" value="1" style="width:100%"></div></div>';
    showModal('批量填报职位 · '+curWeek().label,body,'posBatchSave','应用到所选学生');return;
  }
  if(a==='pbAll'){$$('.pb-stu').forEach(x=>x.checked=true);return;}
  if(a==='pbNone'){$$('.pb-stu').forEach(x=>x.checked=false);return;}
  if(a==='posBatchSave'){
    const stus=$$('.pb-stu').filter(x=>x.checked).map(x=>x.value);
    const poss=$$('.pb-pos').filter(x=>x.checked).map(x=>x.value);
    const mode=fv('pbMode'),cnt=r2(fn('pbCount'));
    if(!stus.length||!poss.length){toast('请至少选择学生和职务','err');return;}
    askConfirm('确认为 '+stus.length+' 名学生'+(mode==='replace'?'替换':'追加')+' '+poss.length+' 项职务？',function(){
      closeModal();
      mutate(()=>{stus.forEach(sid=>{const rec=getRec(UI.weekKey,sid,true);
        const add=poss.map(pid=>{const p=posDef(pid);return {positionId:pid,count:p&&p.mode==='count'?cnt:0,qualified:true};});
        if(mode==='replace')rec.positions=add;
        else{const cur=clone(rec.positions||[]).filter(x=>poss.indexOf(x.positionId)<0);rec.positions=cur.concat(add);}
      });});
      toast('已批量填报 '+stus.length+' 名学生');
    });return;
  }

  /* --- 兑换 --- */
  if(a==='coinPick'){UI.coinStudentId=d.s;rerender();return;}
  if(a==='redeem'){
    const p=S.prizes.find(x=>x.id===d.prize),sid=UI.coinStudentId,st=studentById(sid);
    if(!p||!st){toast('请先选择兑换对象','err');return;}
    const cost=Number(p.cost)||0;
    if(coinBalance(sid)<cost){toast('可用虚拟币不足','err');return;}
    if(Number(p.weeklyLimit)>0){
      const used=S.redemptions.filter(r=>r.status!=='void'&&r.prizeId===p.id&&r.weekKey===UI.weekKey).length;
      if(used>=Number(p.weeklyLimit)){toast('本周该券已达兑换上限（'+fmt(p.weeklyLimit)+' 人）','warn');return;}
    }
    askConfirm('确认为 '+st.name+' 兑换「'+p.name+'」，消耗 '+fmt(cost)+' 虚拟积分？\n\n兑换不会改变其德育加分与德育总分。',function(){
      mutate(()=>{S.redemptions.push({id:uid(),studentId:sid,prizeId:p.id,prizeName:p.name,cost:cost,weekKey:UI.weekKey,date:dstr(new Date()),ts:Date.now(),status:'active'});});
      toast('兑换成功：'+p.name);
    });return;
  }
  if(a==='redeemUndo'){
    const r=S.redemptions.find(x=>x.id===d.id);if(!r||r.status==='void')return;
    askConfirm('确认撤销「'+r.prizeName+'」的兑换？撤销后 '+fmt(r.cost)+' 积分将退回可用余额。',function(){
      mutate(()=>{r.status='void';});toast('兑换已撤销，余额已恢复');
    });return;
  }

  /* --- 奖品管理 --- */
  if(a==='prizeAdd'){UI.modalCtx={mode:'add'};showModal('新增奖品',prizeForm(null),'prizeSave');return;}
  if(a==='prizeEdit'){const p=S.prizes.find(x=>x.id===d.id);if(!p)return;UI.modalCtx={mode:'edit',id:p.id};showModal('编辑奖品 · '+p.name,prizeForm(p),'prizeSave');return;}
  if(a==='prizeSave'){
    const name=fv('pfName');if(!name){toast('券种名称不能为空','err');return;}
    const o={name:name,tier:fv('pfTier'),cost:r2(fn('pfCost')),weeklyLimit:r2(fn('pfLimit')),desc:fv('pfDesc'),enabled:fc('pfEnabled')};
    if(UI.modalCtx.mode==='add'){o.id=uid();S.prizes.push(o);}else{const p=S.prizes.find(x=>x.id===UI.modalCtx.id);if(p)Object.assign(p,o);}
    closeModal();mutate(()=>{});toast('奖品已保存');return;
  }
  if(a==='prizeToggle'){const p=S.prizes.find(x=>x.id===d.id);if(p){p.enabled=!p.enabled;mutate(()=>{});}return;}
  if(a==='prizeDel'){
    const p=S.prizes.find(x=>x.id===d.id);if(!p)return;
    askConfirm('确认删除奖品「'+p.name+'」？历史兑换记录会保留券名与积分快照。',function(){
      S.prizes=S.prizes.filter(x=>x.id!==d.id);mutate(()=>{});toast('奖品已删除');
    });return;
  }

  /* --- 规则与职务 --- */
  if(a==='ruleAdd'){UI.modalCtx={kind:d.kind,mode:'add'};showModal(d.kind==='position'?'新增职务':(d.kind==='plus'?'新增加分项':'新增扣分项'),ruleForm(d.kind,null),'ruleSave');return;}
  if(a==='ruleEdit'){
    const k=d.kind,list=k==='position'?S.positions:(k==='plus'?S.plusRules:S.minusRules),o=list.find(x=>x.id===d.id);
    if(!o)return;UI.modalCtx={kind:k,mode:'edit',id:o.id};showModal('编辑 · '+(o.name||o.label||''),ruleForm(k,o),'ruleSave');return;
  }
  if(a==='ruleSave'){
    const k=UI.modalCtx.kind;
    if(k==='position'){
      const name=fv('rfName');if(!name){toast('职务名称不能为空','err');return;}
      const o={name:name,mode:fv('rfMode'),points:r2(fn('rfPoints')),unit:r2(fn('rfUnit')),group:fv('rfGroup'),note:fv('rfNote')};
      if(UI.modalCtx.mode==='add'){o.id=uid();S.positions.push(o);}else{const p=S.positions.find(x=>x.id===UI.modalCtx.id);if(p)Object.assign(p,o);}
    }else{
      const label=fv('rfLabel');if(!label){toast('项目名称不能为空','err');return;}
      const o={cat:fv('rfCat')||'其他',label:label,points:r2(fn('rfPoints')),cap:k==='plus'?r2(fn('rfCap')):0,note:fv('rfNote')};
      const list=k==='plus'?S.plusRules:S.minusRules;
      if(UI.modalCtx.mode==='add'){o.id=uid();list.push(o);}else{const r=list.find(x=>x.id===UI.modalCtx.id);if(r)Object.assign(r,o);}
    }
    closeModal();mutate(()=>{});toast('已保存');return;
  }
  if(a==='ruleDel'){
    const k=d.kind,list=k==='position'?S.positions:(k==='plus'?S.plusRules:S.minusRules),o=list.find(x=>x.id===d.id);
    if(!o)return;
    askConfirm('确认删除「'+(o.name||o.label)+'」？已登记的历史记录与已填报的职位不会因此改变。',function(){
      if(k==='position')S.positions=list.filter(x=>x.id!==d.id);
      else if(k==='plus')S.plusRules=list.filter(x=>x.id!==d.id);
      else S.minusRules=list.filter(x=>x.id!==d.id);
      mutate(()=>{});toast('已删除');
    });return;
  }

  /* --- 数据管理 --- */
  if(a==='saveSettings'){
    S.className=fv('setClass')||S.className;S.baseScore=r2(fn('setBase'));S.coinIncludePosition=fv('setCoin')==='1';
    mutate(()=>{});toast('设置已保存');return;
  }
  if(a==='studentAdd'){UI.modalCtx={mode:'add'};showModal('新增学生',studentForm(null),'studentSave');return;}
  if(a==='studentEdit'){const s=studentById(d.id);if(!s)return;UI.modalCtx={mode:'edit',id:s.id};showModal('编辑学生 · '+s.name,studentForm(s),'studentSave');return;}
  if(a==='studentSave'){
    const id=fv('sfId'),name=fv('sfName');
    if(!id||!name){toast('学号与姓名不能为空','err');return;}
    if(UI.modalCtx.mode==='add'&&S.students.some(s=>s.id===id)){toast('学号已存在','err');return;}
    const o={seq:r2(fn('sfSeq')),id:id,name:name,sex:fv('sfSex')};
    if(UI.modalCtx.mode==='add')S.students.push(o);else{const s=studentById(UI.modalCtx.id);if(s)Object.assign(s,o);}
    S.students.sort((a,b)=>a.seq-b.seq);
    closeModal();mutate(()=>{});toast('学生已保存');return;
  }
  if(a==='studentDel'){
    const s=studentById(d.id);if(!s)return;
    askConfirm('确认删除学生「'+s.name+'」？其历史记录将保留但不再计入统计。',function(){
      S.students=S.students.filter(x=>x.id!==d.id);mutate(()=>{});toast('学生已删除');
    });return;
  }
  if(a==='rosterImport'){
    UI.modalCtx={};
    showModal('批量导入学生名单','<div class="notice b">每行一名学生，格式：<b>学号,姓名,性别</b>（性别可省略，默认「男」）。也可用制表符分隔。导入为<b>追加</b>，不会删除现有名单。</div><textarea id="riText" placeholder="20261754,张三,男&#10;20261755,李四,女"></textarea>','rosterImportSave','导入');return;
  }
  if(a==='rosterImportSave'){
    const lines=fv('riText').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let n=0;
    lines.forEach(line=>{const p=line.split(/[,，\t]+/).map(x=>x.trim());if(p.length<2)return;
      const id=p[0],name=p[1],sex=p[2]||'男';if(!id||!name||S.students.some(s=>s.id===id))return;
      S.students.push({seq:S.students.length+1,id:id,name:name,sex:sex});n++;});
    S.students.sort((a,b)=>a.seq-b.seq);closeModal();mutate(()=>{});toast('成功导入 '+n+' 名学生');return;
  }
  if(a==='weekAdd'){
    const last=S.weeks[S.weeks.length-1];const start=last?addDays(parseD(last.end),1):new Date();
    const n=S.weeks.length+1,end=addDays(start,6);
    S.weeks.push({key:'W'+n+'_'+uid().slice(0,3),label:'第'+n+'周',start:dstr(start),end:dstr(end),range:md(start)+'–'+md(end)});
    mutate(()=>{});toast('已新增 '+('第'+n+'周'));return;
  }
  if(a==='weekPick'){UI.weekKey=d.key;rerender();return;}
  if(a==='weekDel'){
    const w=weekByKey(d.key);if(!w)return;
    askConfirm('确认删除 '+w.label+'（'+w.start+' ~ '+w.end+'）？该周全部加减分记录与职位填报将一并删除，且不可恢复。',function(){
      askConfirm('请再次确认：删除后无法撤销。是否继续？',function(){
        S.weeks=S.weeks.filter(x=>x.key!==d.key);
        Object.keys(S.records).forEach(k=>{if(k.indexOf(d.key+'::')===0)delete S.records[k];});
        if(UI.weekKey===d.key)UI.weekKey=(S.weeks[0]||{}).key||'';
        mutate(()=>{});toast('周次已删除');
      });
    });return;
  }
  if(a==='exportJson'){download('德育积分备份_'+dstr(new Date())+'.json',JSON.stringify(S,null,2),'application/json;charset=utf-8');toast('已导出完整备份');return;}
  if(a==='importJson'){$('#fileImport').click();return;}
  if(a==='exportCsv'){
    const rows=sortedStatRows();
    let csv='\ufeff名次,序号,学号,姓名,性别,';
    if(UI.catDim)csv+=dimLabel(UI.catDim)+',';
    csv+='单项加分,职务加分,总加分,总扣分,总分,可用虚拟币,预警\n';
    rows.forEach(r=>{
      const base=[r._rank,r.seq,r.id,r.name,r.sex];
      if(UI.catDim)base.push(fmt(r.catVal));
      csv+=base.concat([fmt(r.plusEntries),fmt(r.posBonus),fmt(r.totalPlus),fmt(r.totalMinus),fmt(r.total),fmt(r.coin),r.warn])
        .map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')+'\n';
    });
    download('德育积分统计_'+(UI.scope==='week'?curWeek().label:'学期累计')+(UI.catDim?'_'+dimLabel(UI.catDim):'')+'_'+dstr(new Date())+'.csv',csv,'text/csv;charset=utf-8');toast('CSV 已导出');return;
  }
  if(a==='exportRedeemCsv'){
    let csv='\ufeff时间,周次,学号,姓名,券种,消耗积分,状态\n';
    S.redemptions.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).forEach(r=>{const s=studentById(r.studentId),w=weekByKey(r.weekKey);
      csv+=[r.date,w.label,s?s.id:r.studentId,s?s.name:'',r.prizeName,fmt(r.cost),r.status==='void'?'已撤销':'有效'].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')+'\n';});
    download('兑换流水_'+dstr(new Date())+'.csv',csv,'text/csv;charset=utf-8');toast('兑换流水已导出');return;
  }
  if(a==='resetAll'){
    askConfirm('确认恢复出厂数据？将清空所有加减分记录、职位填报、兑换流水，并还原名单、规则、职务与奖品。',function(){
      askConfirm('请再次确认：此操作不可撤销，建议先导出 JSON 备份。是否继续？',function(){
        S=defaultState();UI.weekKey=S.weeks[0].key;UI.coinStudentId=S.students[0].id;
        mutate(()=>{});toast('已恢复出厂数据');
      });
    });return;
  }
});

/* ---- change / input 委托 ---- */
document.addEventListener('change',function(ev){
  const t=ev.target;
  if(t.closest('.pos-row')){updatePosSubtotals();updatePosTotal();return;}
  const el=t.closest('[data-chg]');if(!el)return;
  const k=el.dataset.chg;
  if(k==='week'){UI.weekKey=el.value;rerender();return;}
  if(k==='catDim'){UI.catDim=el.value;UI.sortKey=UI.catDim?'catVal':'total';UI.sortDir='desc';rerender();return;}
  if(k==='entryRule'){const r=ruleOf(UI.entryType,el.value),u=document.getElementById('entryUnit');if(u&&r)u.value=r.points;return;}
  if(k==='coinStudent'){UI.coinStudentId=el.value;rerender();return;}
  if(k==='rfMode')return;
});
document.addEventListener('input',function(ev){
  const t=ev.target;
  if(t.closest('.pos-row')){updatePosSubtotals();updatePosTotal();return;}
  if(t.id==='pbQ'){
    const q=t.value.trim();$$('.pb-stu').forEach(c=>{const lab=c.closest('label');if(lab)lab.style.display=!q||(lab.dataset.name||'').indexOf(q)>=0?'inline-flex':'none';});return;
  }
  if(t.id==='entryStudent'){UI.entryStudent=t.value;return;}
  const el=t.closest('[data-inp]');if(!el)return;
  UI[el.dataset.inp]=el.value;rerender();
});
function updatePosTotal(){
  const box=document.getElementById('posTotal');if(!box)return;
  let total=0;const groups={};
  $$('.pos-row').forEach(row=>{
    const p=posDef(row.dataset.pos);if(!p)return;
    if(!row.querySelector('.pos-check').checked||!row.querySelector('.pos-qual').checked)return;
    const c=row.querySelector('.pos-count');
    const v=p.mode==='count'?r2((Number(c&&c.value)||0)*(Number(p.unit)||0)):r2(Number(p.points)||0);
    const g=(p.group||'').trim();
    if(g)groups[g]=Math.max(groups[g]||0,v);else total+=v;
  });
  Object.keys(groups).forEach(g=>total+=groups[g]);
  box.textContent=fmt(r2(total));
}
$('#fileImport').addEventListener('change',function(ev){
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=function(){
    try{
      const o=parseState(rd.result);
      if(!o)throw new Error('格式不符或数据不完整');
      askConfirm('确认导入备份？当前数据将被完整覆盖。',function(){
        PERSIST.touched=true;
        S=o;UI.weekKey=(S.weeks.find(w=>w.start<=dstr(new Date())&&w.end>=dstr(new Date()))||S.weeks[0]||{}).key||'';
        UI.coinStudentId=(S.students[0]||{}).id||'';
        mutate(()=>{});toast('备份已恢复');
      });
    }catch(e){toast('导入失败：'+e.message,'err');}
  };
  rd.readAsText(f,'utf-8');ev.target.value='';
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')closeModal();});

/* ---- 启动：先验证 Supabase Auth，再渲染并同步云端数据 ---- */
authStart();
</script>
</body>
</html>
